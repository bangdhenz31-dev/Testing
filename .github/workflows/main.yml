name: Android APK Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      # Mengambil source code repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Memberikan izin eksekusi Gradle
      - name: Grant Permission
        run: chmod +x gradlew

      # Build APK Debug
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Build Android Test APK
      - name: Assemble Android Test
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      # Upload Android Test APK
      - name: Upload Android Test APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Test-APK
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: warn
